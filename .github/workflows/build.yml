name: Build Robot Yard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf build_src && mkdir build_src
          unzip -q robot-yard.zip -d build_src

      - name: Build APK
        working-directory: build_src
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp build_src/app/build/outputs/apk/debug/app-debug.apk RobotYard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RobotYard-apk
          path: RobotYard.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Robot Yard build ${{ github.run_number }}
          files: RobotYard.apk
